{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-6 py-12">
    <!-- Title -->
    <div class="text-center mb-10">
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-3">
            AI Resume & Career Analyzer
        </h1>
        <p class="text-slate-400 text-sm md:text-base">
            Analyze skill gaps, ATS fit, and generate a personalized preparation roadmap.
        </p>
    </div>

    <!-- Form Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-10 shadow-2xl">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            
            <!-- Target Career Role -->
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-2">
                    Target Career Role
                </label>
                <input type="text" name="role" required
                    placeholder="e.g. Backend Developer, Civil Site Engineer, Data Analyst"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
            </div>

            <!-- Resume Text -->
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-2">
                    Resume Text <span class="text-xs text-slate-400 font-normal">(Optional if uploading file)</span>
                </label>
                <textarea name="resume_text" rows="6"
                    placeholder="Paste your resume text directly here..."
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"></textarea>
            </div>

            <!-- File Upload & Action Button -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-800">
                <div class="w-full sm:w-auto">
                    <input type="file" name="resume_file" accept=".pdf,.docx,.txt"
                        class="text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-blue-400 hover:file:bg-slate-700 cursor-pointer">
                </div>

                <button type="submit"
                    class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-3 rounded-xl shadow-lg shadow-blue-600/30 transition">
                    Run Analysis
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
