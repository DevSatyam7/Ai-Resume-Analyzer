<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>CareersAnalysis - AI Resume &amp; Career Fit Analyzer</title>
    <meta name="title" content="CareersAnalysis - AI Resume &amp; Career Fit Analyzer">
    <meta name="description" content="Free AI-powered ATS resume checker, real-world salary estimator, and targeted career roadmap generator. Analyze skill gaps and get exam practice questions.">
    <meta name="keywords" content="AI Resume Analyzer, ATS Score Checker, Salary Estimator, Tech Career Roadmap, Exam Syllabus, Mock Interview Viva">
    <meta name="author" content="CareersAnalysis">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ai-resume-analyzer-2jxj.onrender.com/">

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ai-resume-analyzer-2jxj.onrender.com/">
    <meta property="og:site_name" content="CareersAnalysis">
    <meta property="og:title" content="CareersAnalysis - AI Resume &amp; Career Fit Analyzer">
    <meta property="og:description" content="Audit your resume for free, calculate expected pay-scale, and find missing skill gaps instantly.">
    <meta property="og:image" content="{{ url_for('static', filename='favicon.png', _external=True) }}">

    <!-- Twitter Preview Cards -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="CareersAnalysis - AI Resume &amp; Career Fit Analyzer">
    <meta name="twitter:description" content="Free ATS score auditor and tailored roadmap generator for engineers and competitive exams.">
    <meta name="twitter:image" content="{{ url_for('static', filename='favicon.png', _external=True) }}">

    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="s1dPg9Gs-TArej1vQw4ivXCgeKtU_9fvpGBeS2JmlHo" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-blue-600 selection:text-white">

    <!-- Single Clean Sticky Navbar -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-slate-950/80 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            
            <!-- Site Logo (Click to Home) -->
            <a href="/" class="flex items-center gap-2.5 group shrink-0">
                <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo" class="w-8 h-8 rounded-xl object-cover shadow-lg shadow-blue-500/25 group-hover:scale-105 transition duration-300 border border-slate-800">
                <span class="text-base sm:text-xl font-extrabold tracking-tight text-white group-hover:text-blue-400 transition">
                    Careers<span class="text-blue-500">Analysis</span>
                </span>
            </a>

            <!-- Navigation Links -->
            <div class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm font-medium">
                <a href="/" class="text-slate-400 hover:text-white transition">Home</a>
                <a href="/prep-hub" class="text-sky-400 hover:text-sky-300 transition font-semibold flex items-center gap-1">
                    <span>✦</span> Prep Hub
                </a>
                <a href="/history" class="text-slate-400 hover:text-white transition">History</a>
                <a href="/dashboard" class="text-white bg-blue-600/30 border border-blue-500/40 px-3 py-1.5 rounded-xl font-semibold">Dashboard</a>
                <a href="/logout" class="text-rose-400 bg-rose-950/30 hover:bg-rose-900/40 border border-rose-800/40 px-3 py-1.5 rounded-xl transition">Logout</a>
            </div>

        </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="flex-1 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        © 2026 CareersAnalysis. All rights reserved.
    </footer>

</body>
</html>
