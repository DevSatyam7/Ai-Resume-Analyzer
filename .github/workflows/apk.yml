name: Generate APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build Android Package
        run: |
          bubblewrap init --manifest=https://ai-resume-analyzer-2jxj.onrender.com/manifest.json --directory=android-app --skip-validation || true
          cd android-app || mkdir android-app && cd android-app
          # Fallback initialization if needed
