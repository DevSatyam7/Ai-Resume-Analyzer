<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CareersAnalysis</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar with Brand Logo -->
    <header class="w-full border-b border-slate-800 bg-slate-950/80 backdrop-blur-md px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo" class="w-9 h-9 rounded-lg object-cover border border-slate-800">
                <span class="text-xl font-bold text-white">Careers<span class="text-blue-500">Analysis</span></span>
            </a>
            <a href="/login" class="text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 px-4 py-2 rounded-xl transition">
                Log In
            </a>
        </div>
    </header>

    <!-- Sign Up Form Card -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl shadow-blue-900/10">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-xl bg-blue-600/10 text-blue-400 flex items-center justify-center text-2xl mx-auto mb-3">
                    🚀
                </div>
                <h2 class="text-2xl font-bold text-white">Create Account</h2>
                <p class="text-slate-400 text-sm mt-1">Start your AI career and resume audit journey</p>
            </div>

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" name="email" placeholder="name@example.com" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" name="password" minlength="6" placeholder="At least 6 characters" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    <p class="text-[11px] text-slate-500 mt-1.5">Must be at least 6 characters long.</p>
                </div>

                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/25 mt-2">
                    Create Free Account
                </button>
            </form>

            <p class="text-center text-sm text-slate-400 mt-6">
                Already have an account? 
                <a href="/login" class="text-blue-400 font-medium hover:underline">Log in</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        © 2026 CareersAnalysis. All rights reserved.
    </footer>

</body>
</html>
