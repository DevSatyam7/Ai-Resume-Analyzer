name: Generate APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwawind

      - name: Build Android App via PWABuilder
        run: |
          npx @pwabuilder/pwawind generate --manifest https://ai-resume-analyzer-2jxj.onrender.com/manifest.json --outDir ./output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: output/
