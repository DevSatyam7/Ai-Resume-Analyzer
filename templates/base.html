<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareersAnalysis - Dashboard</title>
    
    <!-- Favicon (Browser Tab Icon) -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}">

    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar with Brand Logo -->
    <header class="w-full border-b border-slate-800 bg-slate-950/80 backdrop-blur-md px-6 py-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo" class="w-9 h-9 rounded-lg object-cover border border-slate-800 shadow-md">
                <span class="text-xl font-bold text-white tracking-tight">Careers<span class="text-blue-500">Analysis</span></span>
            </a>
            
            <div class="flex items-center gap-6 text-sm font-medium">
                <a href="/history" class="text-slate-400 hover:text-white transition">History</a>
                <a href="/dashboard" class="text-blue-400 font-semibold transition">Dashboard</a>
                <a href="/logout" class="bg-red-600/10 text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30 px-3.5 py-1.5 rounded-lg transition text-xs font-semibold">
                    Logout
                </a>
            </div>
        </div>
    </header>

    <!-- Page Content (Dashboard / History Forms) -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
