name: Generate APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build Android Package
        run: |
          bubblewrap init --manifest=https://ai-resume-analyzer-2jxj.onrender.com/manifest.json --directory=android-app --skip-validation || true
          cd android-app || true
          bubblewrap build || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            android-app/*.apk
            *.apk
            **/app-release-signed.apk
