<!-- Sticky Header / Navbar -->
<header class="sticky top-0 z-40 backdrop-blur-xl bg-slate-950/90 border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between gap-3">

        <!-- Brand -->
        <a href="/" class="flex items-center gap-2.5 shrink-0">
            <img
                src="{{ url_for('static', filename='favicon.png') }}"
                alt="CareersAnalysis Logo"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl object-cover border border-slate-800 shadow-lg shadow-blue-500/20"
            >
            <span class="text-lg sm:text-xl font-extrabold tracking-tight text-white">
                Careers<span class="text-blue-500">Analysis</span>
            </span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-6 lg:gap-8 text-sm font-medium text-slate-400">
            <a href="/" class="hover:text-white transition">
                Home
            </a>

            <a href="/prep-hub" class="text-sky-400 font-semibold">
                Placement Hub
            </a>

            <a href="/#topic-search-card" class="hover:text-white transition">
                Topic Explorer
            </a>

            <a href="/#pro-features" class="text-purple-300 hover:text-purple-200 transition">
                Recruiter Suite
            </a>

            <a href="/#features" class="hover:text-white transition">
                Modules
            </a>

            <a href="/#architect" class="hover:text-white transition">
                Architect
            </a>
        </nav>

        <!-- Actions -->
        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
            {% if logged_in %}
                <a
                    href="/dashboard"
                    class="text-xs sm:text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white px-3.5 sm:px-5 py-2.5 rounded-xl shadow-lg shadow-blue-600/30 transition whitespace-nowrap"
                >
                    Dashboard
                </a>
            {% else %}
                <a
                    href="/login"
                    class="hidden sm:inline-block text-xs sm:text-sm font-semibold text-slate-300 hover:text-white px-2 py-2 transition"
                >
                    Log In
                </a>

                <a
                    href="/signup"
                    class="text-xs sm:text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white px-3.5 sm:px-5 py-2.5 rounded-xl transition whitespace-nowrap"
                >
                    Get Started
                </a>
            {% endif %}

            <!-- Mobile Menu -->
            <button
                type="button"
                onclick="toggleDrawer(true)"
                class="md:hidden p-2.5 rounded-xl text-slate-300 bg-slate-900 border border-slate-800 hover:text-white transition"
                aria-label="Open Menu"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        d="M4 6h16M4 12h16M4 18h16"
                    />
                </svg>
            </button>
        </div>
    </div>
</header>
