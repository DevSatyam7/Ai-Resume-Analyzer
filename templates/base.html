<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>CareersAnalysis - AI Resume & Career Fit Analyzer</title>
    <meta name="title" content="CareersAnalysis - AI Resume & Career Fit Analyzer">
    <meta name="description" content="Free AI-powered ATS resume checker, real-world salary estimator, and targeted career roadmap generator. Analyze skill gaps and get exam practice questions.">
    <meta name="keywords" content="AI Resume Analyzer, ATS Score Checker, Salary Estimator, Tech Career Roadmap, Exam Syllabus, Mock Interview Viva">
    <meta name="author" content="CareersAnalysis">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ai-resume-analyzer-2jxj.onrender.com/">

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ai-resume-analyzer-2jxj.onrender.com/">
    <meta property="og:site_name" content="CareersAnalysis">
    <meta property="og:title" content="CareersAnalysis - AI Resume & Career Fit Analyzer">
    <meta property="og:description" content="Audit your resume for free, calculate expected pay-scale, and find missing skill gaps instantly.">
    <meta property="og:image" content="{{ url_for('static', filename='favicon.png', _external=True) }}">

    <!-- Twitter Preview Cards -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="CareersAnalysis - AI Resume & Career Fit Analyzer">
    <meta name="twitter:description" content="Free ATS score auditor and tailored roadmap generator for engineers and competitive exams.">
    <meta name="twitter:image" content="{{ url_for('static', filename='favicon.png', _external=True) }}">

    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="s1dPg9Gs-TArej1vQw4ivXCgeKtU_9fvpGBeS2JmlHo" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-blue-600 selection:text-white">

    <!-- Responsive Navbar -->
    <header class="w-full border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
            
            <!-- Brand Logo -->
            <a href="/" class="flex items-center gap-2 flex-shrink-0">
                <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo" class="w-8 h-8 rounded-lg object-cover border border-slate-800">
                <span class="text-base sm:text-lg font-bold text-white tracking-tight">
                    Careers<span class="text-blue-500">Analysis</span>
                </span>
            </a>

            <!-- Nav Links / Actions -->
            <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
                {% if session.get('user') or logged_in %}
                    <a href="/history" class="text-xs sm:text-sm font-medium text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg hover:bg-slate-900 transition">
                        History
                    </a>
                    <a href="/dashboard" class="text-xs sm:text-sm font-semibold text-blue-400 bg-blue-500/10 hover:bg-blue-500/20 px-2.5 sm:px-3 py-1.5 rounded-lg border border-blue-500/20 transition">
                        Dashboard
                    </a>
                    <a href="/logout" class="text-xs sm:text-sm font-medium text-red-400 hover:text-red-300 px-2 sm:px-2.5 py-1.5 rounded-lg hover:bg-red-500/10 transition">
                        Logout
                    </a>
                {% else %}
                    <a href="/login" class="text-xs sm:text-sm font-medium text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg hover:bg-slate-900 transition">
                        Log In
                    </a>
                    <a href="/signup" class="text-xs sm:text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white px-3 sm:px-4 py-1.5 rounded-lg transition shadow-md shadow-blue-600/20 whitespace-nowrap">
                        Get Started
                    </a>
                {% endif %}
            </div>

        </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="flex-1 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        © 2026 CareersAnalysis. All rights reserved.
    </footer>

</body>
</html>
